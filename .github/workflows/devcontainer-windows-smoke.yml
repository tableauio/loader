name: Devcontainer Windows Smoke

# Builds the Windows-container variant of the devcontainer and runs a
# minimal smoke test inside it. Triggered only when files that affect
# the Windows image change, so we don't burn windows-2022 CI minutes on
# unrelated PRs. The Linux container is dogfooded by humans (per
# CLAUDE.md); this job exists because a Windows-container regression is
# much harder for a human to notice locally.

on:
  pull_request:
    paths:
      - '.devcontainer/windows/**'
      - '.devcontainer/shared/**'
      - '.github/workflows/devcontainer-windows-smoke.yml'
  push:
    branches: [master, main]
    paths:
      - '.devcontainer/windows/**'
      - '.devcontainer/shared/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build windows devcontainer + smoke
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Switch Docker to Windows containers
        shell: pwsh
        run: |
          # GitHub-hosted windows-2022 runners ship Moby Engine (not Docker
          # Desktop) and default to Linux-containers mode. The legacy
          # `DockerCli.exe -SwitchDaemon` helper is not present on current
          # runner images. Flip the daemon by re-registering the `docker`
          # Windows service.
          #
          # `dockerd.exe`'s install path is not stable across runner-image
          # versions (Microsoft's MobyOnWindowsRunner installer doesn't
          # commit to one), so we resolve it from the registered service's
          # ImagePath rather than guessing common Program Files locations.
          $ErrorActionPreference = 'Stop'

          $current = (docker info --format '{{.OSType}}' 2>$null)
          Write-Host "Current OSType before switch: $current"
          if ($current -eq 'windows') {
              Write-Host 'Already in Windows-containers mode; nothing to do.'
              docker info | Select-String -Pattern 'OSType|Server Version|Operating System'
              exit 0
          }

          # Discover dockerd.exe via the registered `docker` service's
          # ImagePath in the registry. This works regardless of where the
          # runner image installed Docker.
          $svcKey = 'HKLM:\SYSTEM\CurrentControlSet\Services\docker'
          if (-not (Test-Path $svcKey)) {
              Write-Host '--- diagnostic: docker service not registered ---'
              Get-Service docker* -ErrorAction SilentlyContinue | Format-List Name,Status,StartType
              Get-Command dockerd -ErrorAction SilentlyContinue | Format-List Name,Source
              throw 'docker service is not registered; cannot determine dockerd.exe path.'
          }
          $imagePath = (Get-ItemProperty -Path $svcKey -Name ImagePath).ImagePath
          Write-Host "Service ImagePath: $imagePath"
          # ImagePath may be quoted and may include trailing args; extract
          # the first token (the .exe path) and strip surrounding quotes.
          if ($imagePath -match '^"([^"]+)"' -or $imagePath -match '^(\S+\.exe)') {
              $dockerd = $Matches[1]
          } else {
              $dockerd = ($imagePath -split '\s+')[0]
          }
          if (-not (Test-Path $dockerd)) {
              Write-Host '--- diagnostic: dockerd path from registry does not exist ---'
              Write-Host "  resolved path: $dockerd"
              Get-Command dockerd -ErrorAction SilentlyContinue | Format-List Name,Source
              throw "dockerd.exe not found at $dockerd"
          }
          Write-Host "Using dockerd at: $dockerd"

          # Stop, re-register the service, restart.
          Stop-Service docker
          & $dockerd --unregister-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $dockerd --register-service --service-name docker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Service docker

          # Verify the switch took effect.
          $after = (docker info --format '{{.OSType}}' 2>$null)
          Write-Host "Current OSType after switch: $after"
          if ($after -ne 'windows') {
              Write-Host 'docker info dump on failure:'
              docker info
              throw "Docker daemon did not switch to Windows containers (OSType=$after)."
          }
          docker info | Select-String -Pattern 'OSType|Server Version|Operating System'

      - name: Build devcontainer image
        shell: pwsh
        working-directory: .devcontainer
        run: |
          # Context is .devcontainer/ so `COPY shared\...` resolves.
          # Tag mirrors the devcontainer.json name so it's recognisable
          # in `docker images`. -m 2GB is required for the VS Build Tools
          # install (Microsoft's documented minimum; default 1 GB silently
          # fails partway through).
          docker build `
            --memory 2GB `
            --file windows\Dockerfile `
            --tag loader-devcontainer-windows:smoke `
            .

      - name: Smoke test — Go
        shell: pwsh
        run: |
          # Run `go test ./...` from the repo's Go module inside the
          # built image. The container's working dir is C:\workspaces\loader;
          # bind-mount the checkout there.
          docker run --rm `
            --isolation=hyperv `
            -v "${{ github.workspace }}:C:\workspaces\loader" `
            -w C:\workspaces\loader `
            loader-devcontainer-windows:smoke `
            powershell -NoProfile -Command "go vet ./... ; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"

      - name: Smoke test — buf generate (Go)
        shell: pwsh
        run: |
          docker run --rm `
            --isolation=hyperv `
            -v "${{ github.workspace }}:C:\workspaces\loader" `
            -w C:\workspaces\loader\test\go-tableau-loader `
            loader-devcontainer-windows:smoke `
            powershell -NoProfile -Command "buf generate .. ; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"

      - name: Smoke test — version banner
        shell: pwsh
        run: |
          docker run --rm `
            --isolation=hyperv `
            loader-devcontainer-windows:smoke `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\loader\postcreate-banner.ps1

name: Testing Go

# Trigger on pushes, PRs (excluding documentation changes), and nightly.
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: 0 0 * * * # daily at 00:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read pinned versions
        uses: ./.github/actions/load-versions

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test
        # `make.py test --lang go` runs `buf generate` then `go test`, which
        # transitively vets every package (compilation = type-check + vet).
        # Plugin-only `go vet` is covered by devcontainer-smoke.yml's
        # `make.py test --lang go --smoke` step.
        # Explicit --race so Windows CI matches Linux (Windows runners have
        # MSVC available; -race needs cgo + a C compiler). On a fresh
        # Windows dev machine without MSVC, make.py's default is --no-race;
        # CI overrides that.
        run: python make.py test --lang go --race --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tableauio/loader
